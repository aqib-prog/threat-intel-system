name: Log analysis regression

on:
  pull_request:
    paths:
      - "backend/log_analysis/**"
      - "tools/sigma_compiler/**"
      - "tools/falco_compiler/**"
      - "tools/security_datasets_baseline/**"
      - "tools/windows_structured/**"
      - "tools/linux_structured/**"
      - "tools/macos_structured/**"
      - "tools/regression/**"
      - ".github/workflows/log-analysis-regression.yml"
  push:
    branches: [main]
    paths:
      - "backend/log_analysis/**"
      - "tools/**"
      - ".github/workflows/log-analysis-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/regression/requirements.txt
      - name: Install pinned test dependencies
        run: python -m pip install --requirement tools/regression/requirements.txt
      - name: Fetch pinned external fixtures
        run: python tools/regression/prepare_fixtures.py --root "$RUNNER_TEMP/card5-fixtures" > "$RUNNER_TEMP/card5-fixtures.env"
      - name: Run mandatory full regression gate
        run: |
          set -a
          source "$RUNNER_TEMP/card5-fixtures.env"
          set +a
          python tools/regression/run.py --mode full
