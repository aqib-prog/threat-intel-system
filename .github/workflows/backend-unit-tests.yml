name: Backend unit tests

# Fast, hermetic unit tests for the backend. None of these connect to Neo4j or
# Ollama - the multi-intent wrapper tests monkeypatch run_pipeline/get_driver/
# the log detector, and the answer-section and langfuse-helper tests are pure.
# The third-party packages below are needed only so the modules IMPORT.

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-unit-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-unit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        # requirements-api.txt (fastapi/slowapi/langfuse) plus the import-time
        # runtime deps of the pipeline import graph. Pinned to the versions the
        # local venv uses so CI matches development.
        run: |
          python -m pip install --requirement backend/requirements-api.txt
          python -m pip install neo4j==6.2.0 rapidfuzz==3.14.5 ollama==0.6.2
      - name: Run backend unit tests
        working-directory: backend
        run: |
          python -m unittest \
            orchestration.test_multi_intent \
            orchestration.test_query_decomposer \
            orchestration.test_entity_resolution \
            generation.test_relationship_routing \
            retrieval.test_graph_traversal_scope \
            retrieval.test_spell_normalize \
            retrieval.test_benign_lookup \
            api.test_answer_sections \
            api.test_query_response \
            observability.test_langfuse_tracing
